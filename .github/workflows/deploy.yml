name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy tvp-bot
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP}/tvp-docker.XXXXXX")
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$GHCR_TOKEN" | docker --config "$DOCKER_CONFIG" login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

          COMPOSE_FILE=/mnt/containers/compose/docker-compose.yml
          sudo env DOCKER_CONFIG="$DOCKER_CONFIG" docker compose -f "$COMPOSE_FILE" pull tvp-bot
          sudo env DOCKER_CONFIG="$DOCKER_CONFIG" docker compose -f "$COMPOSE_FILE" up \
            -d --no-deps --pull never tvp-bot

